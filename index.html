<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flipbook" />
    <meta name="theme-color" content="#212329" />
    <title>Flipbook</title>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="toolbar" role="toolbar" aria-label="Drawing tools">
      <button id="tool-brush" class="tool" aria-label="Brush" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20c0-2.5 1.2-4 3.2-4 1.6 0 2.8 1.2 2.8 2.8C10 21 8 22 4 20Zm5.5-5.2 8.9-10.4a1.7 1.7 0 0 1 2.5 2.3L10.9 16l-1.4-1.2Z"/></svg>
      </button>
      <button id="tool-eraser" class="tool" aria-label="Eraser" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.1 3.6a2 2 0 0 1 2.8 0l3.5 3.5a2 2 0 0 1 0 2.8L11.8 19.5H20v2H7.6l-4-4a2 2 0 0 1 0-2.8L15.1 3.6ZM9 19.5l2.6-2.6-5-5-2.3 2.3 4 4 .7 1.3Z"/></svg>
      </button>
      <span class="sep"></span>
      <label class="size">
        <span id="size-dot-box"><span id="size-dot"></span></span>
        <input id="size" type="range" min="2" max="80" step="1" value="12" aria-label="Brush size" />
      </label>
      <span class="sep"></span>
      <div id="swatches" role="radiogroup" aria-label="Colour"></div>
      <span class="sep"></span>
      <button id="clear" class="tool" aria-label="Clear drawing">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 12H7L6 9Zm4 2v8h1.5v-8H10Zm2.5 0v8H14v-8h-1.5Z"/></svg>
      </button>
      <button id="stats" class="tool" aria-label="Performance stats" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h3.5v10H4Zm6.25 0V4h3.5v16h-3.5Zm6.25 0v-7H20v7h-3.5Z"/></svg>
      </button>
    </div>

    <div id="hud" hidden>
      <pre id="hud-text"></pre>
      <div class="hud-buttons">
        <button id="hud-input"></button>
        <button id="hud-predict"></button>
        <button id="hud-reset">Reset stats</button>
      </div>
    </div>

    <div id="fatal" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
